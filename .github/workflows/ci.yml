name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - if: matrix.node == 20
        run: npm test -- test/webview.test.ts
      - if: matrix.node == 22
        run: npm run verify
      - if: matrix.node == 22
        run: npm run build
